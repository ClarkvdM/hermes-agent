# TEMPORARY — PR #106742 native proof; never merges.
#
# Native Windows + macOS proof of the merged head (integ-full-1) on real GitHub runners.
# Fires only on pushes to wine2e/106742-* throwaway branches; the branches are deleted after.
name: wine2e 106742 native proof (temporary)

on:
  push:
    branches:
      - "wine2e/106742-**"

permissions:
  contents: read

concurrency:
  group: wine2e-106742-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }} / ${{ matrix.leg }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        leg: [marked, touched]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        timeout-minutes: 10

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        timeout-minutes: 5
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.14
        uses: ./.github/actions/retry
        timeout-minutes: 10
        with:
          command: uv python install 3.14

      - name: Install dependencies
        uses: ./.github/actions/retry
        timeout-minutes: 25
        with:
          command: uv sync --locked --python 3.14 --extra all --extra messaging --group dev --group test

      - name: Run native leg
        shell: bash
        timeout-minutes: 60
        env:
          W2E_JOB: ${{ matrix.os }}
          W2E_LEG: ${{ matrix.leg }}
          W2E_ARTIFACT_DIR: ${{ github.workspace }}/w2e-logs
          UGW_ARTIFACT_DIR: ${{ github.workspace }}/w2e-logs
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
        run: |
          set -uo pipefail
          mkdir -p w2e-logs
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$PWD/.venv/Scripts/python.exe"; else PY="$PWD/.venv/bin/python"; fi
          export HERMES_PYTHON="$PY" HERMES_TEST_WORKERS=4 HERMES_TEST_FILE_TIMEOUT=900
          "$PY" scripts/ci/wine2e_106742_shim.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: w2e-106742-${{ matrix.os }}-${{ matrix.leg }}
          path: w2e-logs/
          if-no-files-found: warn
